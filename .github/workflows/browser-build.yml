# Builds the firmware for the browser with simple-touch-web, checks that it
# boots, and adds it to the simple-touch-web branch. The run's summary links
# it to the test bench and has the "emulator" block that lets the Simple
# Touch library play it (see simple-touch-labels.json).

name: Browser build

on:
  push:
    branches: [main, browser-build]
    paths-ignore:
      - 'visualizer/**'
      - 'tools/**'
      - '**.md'
  workflow_dispatch:

jobs:
  browser:
    # Needs v1.1 or later (builds .cc sources: Plaits, stmlib) and v1.2 for LED
    # blinks made inside a loop pass. v1 follows the newest 1.x.
    uses: jonwaterschoot/simple-touch-web/.github/workflows/build-firmware.yml@v1
    permissions:
      contents: write
