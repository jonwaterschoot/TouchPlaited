<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="site-head.css">
  <style>
    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.6 var(--font);
    }
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 10px 20px 40px;
    }
    footer {
      max-width: 900px;
      margin: 0 auto;
      padding: 14px 20px 32px;
      border-top: 1px solid var(--line);
      color: var(--dim);
      font-size: 12px;
    }
    footer a { color: var(--dim); }
    footer a:hover { color: var(--accent-hi); }
    /* --- rendered markdown ------------------------------------------- */
    main h1, main h2, main h3, main h4 {
      color: var(--accent);
      line-height: 1.25;
      margin: 1.6em 0 0.5em;
    }
    main h1 { font-size: 22px; }
    main h2 { font-size: 17px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
    main h3 { font-size: 14px; }
    main a { color: var(--accent); }
    main a:hover { color: var(--accent-hi); }
    main img { max-width: 100%; height: auto; border: 1px solid var(--line); }
    main code {
      background: var(--surface);
      border: 1px solid var(--line);
      padding: 0 4px;
      font-family: var(--font);
      font-size: 13px;
    }
    main pre {
      background: var(--surface);
      border: 1px solid var(--line);
      padding: 12px 14px;
      overflow-x: auto;
    }
    main pre code { background: none; border: none; padding: 0; }
    main table {
      border-collapse: collapse;
      display: block;
      overflow-x: auto;
      font-size: 13px;
    }
    main th, main td {
      border: 1px solid var(--line);
      padding: 5px 10px;
      text-align: left;
      vertical-align: top;
    }
    main th { color: var(--accent); background: var(--surface); }
    main blockquote {
      margin: 1em 0;
      padding: 2px 14px;
      border-left: 2px solid var(--accent);
      color: var(--dim);
    }
    main hr { border: none; border-top: 1px solid var(--line); }
    main li { margin: 3px 0; }
    main details {
      margin: 10px 0;
      border: 1px solid var(--line);
      background: var(--surface);
    }
    main summary {
      cursor: pointer;
      padding: 7px 12px;
      color: var(--accent);
      font-weight: 700;
    }
    main summary:hover { color: var(--accent-hi); }
    main details[open] > summary { border-bottom: 1px solid var(--line); }
    main details > :not(summary) { margin-left: 12px; margin-right: 12px; }
    main details code, main details th { background: var(--bg); }
    main .cta {
      display: inline-block;
      padding: 7px 14px;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
    }
    main .cta:hover { background: var(--accent); color: var(--bg); }
  </style>
</head>
<body>
{{header}}
  <main>
{{content}}
  </main>
  <footer>
    TouchPlaited · firmware for the Synthux Simple Touch ·
    <a href="https://github.com/jonwaterschoot/TouchPlaited">github.com/jonwaterschoot/TouchPlaited</a>
  </footer>
</body>
</html>
